name: build-kaigen-windows-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build portable archive
        shell: powershell
        run: .\scripts\build-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Kaigen-portable-windows-x64
          path: artifacts/Kaigen-portable-windows-x64.zip
          if-no-files-found: error
