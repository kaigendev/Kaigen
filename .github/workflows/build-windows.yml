name: build-kaigen-windows-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          targets: x86_64-pc-windows-msvc
      - name: Prime GitHub runner dependencies
        shell: powershell
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
        run: |
          $env:KAIGEN_COMPONENT_UPDATE_SCOPE = "all-managed-components"
          .\scripts\prepare-dependencies.ps1 `
            -ComponentCacheRoot $env:KAIGEN_COMPONENT_CACHE_ROOT `
            -AllowNetworkComponentFetch
          npm ci
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build portable archive
        shell: powershell
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
        run: .\scripts\build-portable.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-portable-windows-x64
          path: artifacts/Kaigen-portable-windows-x64.zip
          if-no-files-found: error
