name: build-kaigen-windows-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      handoff-artifact-id: ${{ steps.upload-handoff.outputs.artifact-id }}
      handoff-manifest-sha256: ${{ steps.handoff.outputs.manifest-sha256 }}
      producer-attempt: ${{ steps.handoff.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve canonical release version before compilation
        run: node scripts/release-version.mjs --github-env
      - name: Verify public incremental baseline and prepare exact selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-incremental-verification.mjs prepare --platform windows --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned PowerShell 7.6.5
        shell: cmd
        run: |
          dotnet tool install --tool-path "${{ runner.temp }}\kaigen-pwsh" PowerShell --version 7.6.5
          echo ${{ runner.temp }}\kaigen-pwsh>>"%GITHUB_PATH%"
      - name: Prime GitHub runner dependencies
        shell: cmd
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
          KAIGEN_COMPONENT_UPDATE_SCOPE: all-managed-components
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe"
          -NoLogo -NoProfile -NonInteractive
          -File scripts\Invoke-KaigenAutomation.ps1
          -Task ci-windows-prime
          -ComponentCacheRoot "${{ runner.temp }}\kaigen-component-cache"
      - name: Build portable archive
        shell: cmd
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
          KAIGEN_PREPARED_NATIVE_CACHE_ROOT: ${{ runner.temp }}\kaigen-prepared-native-cache
          KAIGEN_PREPARED_NATIVE_CACHE_MODE: build-on-miss
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe"
          -NoLogo -NoProfile -NonInteractive
          -File scripts\Invoke-KaigenAutomation.ps1
          -Task windows-portable
          -VerificationPlanPath "%KAIGEN_WINDOWS_VERIFICATION_PLAN%"
          -VerificationPlanSha256 "%KAIGEN_WINDOWS_VERIFICATION_PLAN_SHA256%"
      - name: Create exact Windows build handoff
        id: handoff
        run: >-
          node scripts/windows-ci-handoff.mjs create
          --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
          --handoff-root "${{ runner.temp }}/kaigen-windows-handoff"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-handoff
        with:
          name: Kaigen-windows-build-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kaigen-windows-handoff/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  package:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve canonical release version
        run: node scripts/release-version.mjs --github-env
      - name: Validate exact build handoff locator
        env:
          KAIGEN_HANDOFF_ARTIFACT_ID: ${{ needs.build.outputs.handoff-artifact-id }}
          KAIGEN_HANDOFF_MANIFEST_SHA256: ${{ needs.build.outputs.handoff-manifest-sha256 }}
          KAIGEN_HANDOFF_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
        run: |
          if ($env:KAIGEN_HANDOFF_ARTIFACT_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Exact successful build artifact ID is required.' }
          if ($env:KAIGEN_HANDOFF_MANIFEST_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact build manifest digest is required.' }
          if ($env:KAIGEN_HANDOFF_PRODUCER_ATTEMPT -cnotmatch '^[1-9][0-9]*$') { throw 'Exact producer attempt is required.' }
      - name: Download this run's successful build handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.handoff-artifact-id }}
          path: ${{ runner.temp }}/kaigen-windows-handoff
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and restore exact build evidence
        env:
          KAIGEN_HANDOFF_MANIFEST_SHA256: ${{ needs.build.outputs.handoff-manifest-sha256 }}
          KAIGEN_HANDOFF_PRODUCER_ATTEMPT: ${{ needs.build.outputs.producer-attempt }}
        run: >-
          node scripts/windows-ci-handoff.mjs restore
          --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
          --handoff-root "${{ runner.temp }}/kaigen-windows-handoff"
      # MSI generation compiles its small shutdown helper; portable/Cargo compilation stays in build.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned PowerShell 7.6.5
        shell: cmd
        run: |
          dotnet tool install --tool-path "${{ runner.temp }}\kaigen-pwsh" PowerShell --version 7.6.5
          echo ${{ runner.temp }}\kaigen-pwsh>>"%GITHUB_PATH%"
      - name: Expand verified portable payload for MSI
        run: Expand-Archive -LiteralPath artifacts/Kaigen-portable-windows-x64.zip -DestinationPath artifacts
      - name: Prepare pinned WiX 3.14.1 for MSI generation
        shell: pwsh
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -cne '7.6.5') { throw 'WiX preparation requires PowerShell 7.6.5 exactly.' }
          [IO.Directory]::CreateDirectory($env:KAIGEN_COMPONENT_CACHE_ROOT) | Out-Null
          $wixArchive = Join-Path $env:KAIGEN_COMPONENT_CACHE_ROOT 'wix314-binaries.zip'
          $wixSha256 = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if (-not (Test-Path -LiteralPath $wixArchive -PathType Leaf)) {
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $wixArchive
          }
          if ((Get-FileHash -LiteralPath $wixArchive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $wixSha256) {
            throw 'WiX 3.14.1 archive differs from the pinned SHA-256.'
          }
          $wixRoot = Join-Path $env:RUNNER_TEMP 'kaigen-wix-3.14.1'
          Expand-Archive -LiteralPath $wixArchive -DestinationPath $wixRoot
          foreach ($name in @('candle.exe', 'light.exe', 'WixUIExtension.dll', 'WixUtilExtension.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $wixRoot $name) -PathType Leaf)) { throw "Pinned WiX tool is missing: $name" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $wixRoot -Encoding utf8
      - name: Build and verify MSI installer
        shell: cmd
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe"
          -NoLogo -NoProfile -NonInteractive
          -File scripts\build-windows-msi.ps1
          -PortableRoot artifacts\Kaigen-portable
          -ReleaseLabel "%KAIGEN_RELEASE_LABEL%"
          -ArtifactsDir artifacts
      - name: Bind incremental verification to final artifacts
        run: >-
          node scripts/ci-incremental-verification.mjs finalize
          --platform windows --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
          --archive artifacts/Kaigen-portable-windows-x64.zip
          --archive artifacts/Kaigen-installer-windows-x64.msi
          --archive artifacts/Kaigen-installer-windows-x64.manifest.json
          --archive artifacts/Kaigen-source-github.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-verification-windows
          path: artifacts/ci-verification-windows.json
          # A package retry replaces only this run's partial public outputs.
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-portable-windows-x64
          path: artifacts/Kaigen-portable-windows-x64.zip
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-installer-windows-x64
          overwrite: true
          path: |
            artifacts/Kaigen-installer-windows-x64.msi
            artifacts/Kaigen-installer-windows-x64.manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-source-github
          path: artifacts/Kaigen-source-github.zip
          overwrite: true
          if-no-files-found: error
