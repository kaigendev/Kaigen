name: publish-kaigen-release-0298

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit for publication
        required: true
        type: string
      visibility_run_id:
        description: Successful saved visibility verification run
        required: true
        type: string
      visibility_environment_sha256:
        description: Reviewed environment hash from that visibility receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kaigen-release-0.2.9.8-actions
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kaigendev/Kaigen' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check canonical version against the historical publisher
        run: node scripts/release-version.mjs --github-env --expect-tag v0.2.9.8 --verification-catalog ci/verification-v0.2.9.8.json
      - name: Install pinned PowerShell for the canonical source archive
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/kaigen-pwsh" PowerShell --version 7.6.5
          echo "$RUNNER_TEMP/kaigen-pwsh" >> "$GITHUB_PATH"
      - name: Verify saved producer and visibility evidence; publish exact artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-actions-release.mjs publish "$RUNNER_TEMP/kaigen-actions-publication"
      - name: Preserve safe operation and server verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-Actions-publication-${{ env.KAIGEN_RELEASE_LABEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kaigen-actions-publication/*.json
          if-no-files-found: warn
