name: publish-kaigen-site-0298

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kaigen-release-0.2.9.8-actions
  cancel-in-progress: false

jobs:
  publish-site:
    if: github.repository == 'kaigendev/Kaigen' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate the public package and append its exact release asset
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node site-release/0.2.9.8/publish-site.mjs publish "$RUNNER_TEMP/kaigen-site-publication"
      - name: Preserve the public site publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-Site-publication-0.2.9.8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kaigen-site-publication/site-publication.json
          if-no-files-found: warn
