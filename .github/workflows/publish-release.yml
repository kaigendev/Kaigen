name: publish-kaigen-release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit built by both successful producers
        required: true
        type: string
      windows_run_id:
        description: Successful build-windows.yml run for that commit
        required: true
        type: string
      unix_run_id:
        description: Successful build-unix.yml run for that commit
        required: true
        type: string

concurrency:
  group: kaigen-release-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'kaigendev/Kaigen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
      UNIX_RUN_ID: ${{ inputs.unix_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bind successful producer artifacts to exact main and current attempts
        id: producers
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { EXPECTED_SHA: sha, GITHUB_REPOSITORY: repo } = process.env;
          assert.match(sha, /^[a-f0-9]{40}$/);
          assert.equal(repo, 'kaigendev/Kaigen');
          assert.equal(process.env.GITHUB_SHA, sha, 'publisher dispatch must use the exact current main');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sha);
          async function api(route) {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + route, {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            assert.equal(response.status, 200, 'producer metadata unavailable');
            return response.json();
          }
          assert.equal((await api('branches/main')).commit.sha, sha, 'main moved since dispatch');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          assert.match(version, /^\d+\.\d+\.\d+(?:\+\d+(?:\.\d+)?)?$/);
          const label = version.replace('+', '.');
          for (const [id, workflow, selected] of [
            [process.env.WINDOWS_RUN_ID, '.github/workflows/build-windows.yml', [['windows', 'Kaigen-portable-windows-x64'], ['installer', 'Kaigen-installer-windows-x64'], ['source', 'Kaigen-source-github']]],
            [process.env.UNIX_RUN_ID, '.github/workflows/build-unix.yml', [['debian', 'Kaigen-portable-debian-x64'], ['macos', 'Kaigen-portable-macos-universal'], ['web', 'Kaigen-Web-Debian13-Nginx-' + label]]]
          ]) {
            assert.match(id, /^[1-9]\d*$/);
            assert.ok(Number.isSafeInteger(Number(id)));
            const run = await api('actions/runs/' + id);
            assert.equal(run.repository.full_name, repo);
            assert.equal(run.head_repository.full_name, repo);
            assert.equal(run.head_sha, sha);
            assert.equal(run.head_branch, 'main');
            assert.ok(['push', 'workflow_dispatch'].includes(run.event));
            assert.equal(run.path, workflow);
            assert.equal(run.status, 'completed');
            assert.equal(run.conclusion, 'success');
            assert.ok(Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0);
            const artifacts = (await api('actions/runs/' + id + '/artifacts?per_page=100')).artifacts;
            for (const [key, name] of selected) {
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              assert.equal(matches.length, 1, 'one exact producer artifact required: ' + name);
              const artifact = matches[0];
              assert.equal(artifact.workflow_run.id, Number(id));
              assert.equal(artifact.workflow_run.head_sha, sha);
              assert.ok(Date.parse(artifact.created_at) >= Date.parse(run.run_started_at), 'artifact predates current producer attempt');
              assert.match(artifact.digest, /^sha256:[a-f0-9]{64}$/);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + artifact.id + '\n');
            }
          }
          JS
      - name: Resolve canonical release version
        run: node scripts/release-version.mjs --github-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.windows }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/windows
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.installer }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/installer
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.source }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/source
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.debian }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/debian
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.macos }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/macos
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.web }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/web
          merge-multiple: true
          digest-mismatch: error
      - name: Publish seven exact Actions-produced assets without running tests
        run: |
          set -euo pipefail
          mkdir release
          cp incoming/windows/Kaigen-portable-windows-x64.zip release/
          cp incoming/installer/Kaigen-installer-windows-x64.msi release/
          cp incoming/debian/Kaigen-portable-debian-x64.zip release/
          cp incoming/macos/Kaigen-portable-macos-universal.zip release/
          cp "incoming/web/Kaigen-Web-Debian13-Nginx-$KAIGEN_RELEASE_LABEL.tar.gz" release/
          cp "incoming/web/Kaigen-Web-Installer-$KAIGEN_RELEASE_LABEL.sh" release/
          cp incoming/source/Kaigen-source-github.zip "release/Kaigen-source-$KAIGEN_RELEASE_LABEL.zip"
          sha256sum release/*
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$current_main" == "$EXPECTED_SHA" ]] || { echo 'main moved before publication' >&2; exit 1; }
          if git rev-parse --verify "refs/tags/$KAIGEN_RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(git rev-parse "$KAIGEN_RELEASE_TAG^{commit}")" == "$EXPECTED_SHA" ]] || { echo 'existing tag belongs to another commit' >&2; exit 1; }
          fi
          if gh release view "$KAIGEN_RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release view "$KAIGEN_RELEASE_TAG" --json isDraft,assets > existing-draft.json
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const draft = JSON.parse(fs.readFileSync('existing-draft.json', 'utf8'));
          assert.equal(draft.isDraft, true, 'existing published release is preserved');
          const expected = new Set(fs.readdirSync('release'));
          assert.equal(expected.size, 7, 'seven producer assets required');
          assert.ok(draft.assets.every(asset => expected.has(asset.name)), 'existing draft contains unrelated assets; preserve it without uploading');
          JS
          else
            printf 'Kaigen %s. Desktop Windows, Debian, macOS and Web packages produced by GitHub Actions.\n\nmacOS: ad-hoc signed, not notarized.\n' "$KAIGEN_RELEASE_LABEL" > release-notes.txt
            gh release create "$KAIGEN_RELEASE_TAG" --target "$EXPECTED_SHA" --title "Kaigen $KAIGEN_RELEASE_LABEL" --notes-file release-notes.txt --draft
          fi
          gh release upload "$KAIGEN_RELEASE_TAG" release/* --clobber
          gh release view "$KAIGEN_RELEASE_TAG" --json assets > uploaded-assets.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const expected = fs.readdirSync('release').sort();
          const uploaded = JSON.parse(fs.readFileSync('uploaded-assets.json', 'utf8')).assets.map(asset => asset.name).sort();
          assert.deepEqual(uploaded, expected, 'asset set changed; preserve draft without publishing');
          JS
          gh release edit "$KAIGEN_RELEASE_TAG" --draft=false
