name: publish-kaigen-release

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the reviewed current-version release manifest
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kaigen-release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kaigendev/Kaigen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve the canonical release version
        run: node scripts/release-version.mjs --github-env
      - name: Install pinned PowerShell for the source archive
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/kaigen-pwsh" PowerShell --version 7.6.5
          echo "$RUNNER_TEMP/kaigen-pwsh" >> "$GITHUB_PATH"
      - name: Verify the complete release gate and publish exact Actions assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KAIGEN_RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: node scripts/publish-release.mjs publish "$RUNNER_TEMP/kaigen-actions-publication"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Kaigen-Actions-publication-${{ env.KAIGEN_RELEASE_LABEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kaigen-actions-publication/*.json
          if-no-files-found: warn
