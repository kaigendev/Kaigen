name: publish-kaigen-release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main commit built by both successful producers
        required: true
        type: string
      windows_run_id:
        description: Successful build-windows.yml run for that commit
        required: true
        type: string
      unix_run_id:
        description: Successful build-unix.yml run for that commit
        required: true
        type: string
      existing_release_id:
        description: Published release ID for a same-version asset refresh
        required: false
        type: string
      existing_tag_sha:
        description: Original published tag commit to preserve during an asset refresh
        required: false
        type: string

concurrency:
  group: kaigen-release-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.repository == 'kaigendev/Kaigen' &&
      (github.ref == 'refs/heads/main' ||
      (inputs.existing_release_id != '' && startsWith(github.ref, 'refs/heads/pq/release-publisher-')))
    runs-on: ubuntu-22.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
      UNIX_RUN_ID: ${{ inputs.unix_run_id }}
      EXISTING_RELEASE_ID: ${{ inputs.existing_release_id }}
      EXISTING_TAG_SHA: ${{ inputs.existing_tag_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bind successful producer artifacts to exact main and current attempts
        id: producers
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { releaseVersion } from './scripts/release-version.mjs';
          const { EXPECTED_SHA: sha, GITHUB_REPOSITORY: repo } = process.env;
          assert.match(sha, /^[a-f0-9]{40}$/);
          const { EXISTING_RELEASE_ID: releaseId, EXISTING_TAG_SHA: tagSha } = process.env;
          assert.equal(Boolean(releaseId), Boolean(tagSha), 'provide both asset refresh inputs or neither');
          if (releaseId) {
            assert.match(releaseId, /^[1-9]\d*$/);
            assert.ok(Number.isSafeInteger(Number(releaseId)));
            assert.match(tagSha, /^[a-f0-9]{40}$/);
            assert.notEqual(tagSha, sha, 'asset refresh must identify a new commit');
            execFileSync('git', ['merge-base', '--is-ancestor', tagSha, sha]);
          }
          assert.equal(repo, 'kaigendev/Kaigen');
          const workflowCommit = process.env.GITHUB_SHA;
          if (process.env.GITHUB_REF !== 'refs/heads/main') {
            assert.ok(releaseId && process.env.GITHUB_REF?.startsWith('refs/heads/pq/release-publisher-'));
            assert.match(workflowCommit, /^[a-f0-9]{40}$/);
            assert.equal(process.env.GITHUB_WORKFLOW_SHA, workflowCommit);
            assert.equal(execFileSync('git', ['rev-parse', workflowCommit + '^'], { encoding: 'utf8' }).trim(), sha);
            const changed = execFileSync('git', ['diff', '--name-only', sha, workflowCommit], { encoding: 'utf8' }).trim();
            assert.equal(changed, '.github/workflows/publish-release.yml', 'publisher recovery may only change its workflow');
          } else {
            assert.equal(workflowCommit, sha, 'publisher dispatch must use the exact current main');
          }
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sha);
          async function api(route) {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + route, {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            assert.equal(response.status, 200, 'producer metadata unavailable');
            return response.json();
          }
          assert.equal((await api('branches/main')).commit.sha, sha, 'main moved since dispatch');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const label = releaseVersion(version).releaseLabel;
          for (const [id, workflow, selected] of [
            [process.env.WINDOWS_RUN_ID, '.github/workflows/build-windows.yml', [['windows', 'Kaigen-portable-windows-x64'], ['installer', 'Kaigen-installer-windows-x64'], ['source', 'Kaigen-source-github']]],
            [process.env.UNIX_RUN_ID, '.github/workflows/build-unix.yml', [['debian', 'Kaigen-portable-debian-x64'], ['macos', 'Kaigen-portable-macos-universal'], ['web', 'Kaigen-Web-Debian13-Nginx-' + label]]]
          ]) {
            assert.match(id, /^[1-9]\d*$/);
            assert.ok(Number.isSafeInteger(Number(id)));
            const run = await api('actions/runs/' + id);
            assert.equal(run.repository.full_name, repo);
            assert.equal(run.head_repository.full_name, repo);
            assert.equal(run.head_sha, sha);
            assert.equal(run.head_branch, 'main');
            assert.ok(['push', 'workflow_dispatch'].includes(run.event));
            assert.equal(run.path, workflow);
            assert.equal(run.status, 'completed');
            assert.equal(run.conclusion, 'success');
            assert.ok(Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0);
            const artifacts = (await api('actions/runs/' + id + '/artifacts?per_page=100')).artifacts;
            for (const [key, name] of selected) {
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              assert.equal(matches.length, 1, 'one exact producer artifact required: ' + name);
              const artifact = matches[0];
              assert.equal(artifact.workflow_run.id, Number(id));
              assert.equal(artifact.workflow_run.head_sha, sha);
              assert.ok(Date.parse(artifact.created_at) >= Date.parse(run.run_started_at), 'artifact predates current producer attempt');
              assert.match(artifact.digest, /^sha256:[a-f0-9]{64}$/);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + artifact.id + '\n');
            }
          }
          JS
      - name: Resolve canonical release version
        run: node scripts/release-version.mjs --github-env
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.windows }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/windows
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.installer }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/installer
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.source }}
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming/source
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.debian }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/debian
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.macos }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/macos
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producers.outputs.web }}
          run-id: ${{ inputs.unix_run_id }}
          github-token: ${{ github.token }}
          path: incoming/web
          merge-multiple: true
          digest-mismatch: error
      - name: Prepare the seven exact Actions-produced assets
        run: |
          set -euo pipefail
          mkdir release
          cp incoming/windows/Kaigen-portable-windows-x64.zip release/
          cp incoming/installer/Kaigen-installer-windows-x64.msi release/
          cp incoming/debian/Kaigen-portable-debian-x64.zip release/
          cp incoming/macos/Kaigen-portable-macos-universal.zip release/
          cp "incoming/web/Kaigen-Web-Debian13-Nginx-$KAIGEN_RELEASE_LABEL.tar.gz" release/
          cp "incoming/web/Kaigen-Web-Installer-$KAIGEN_RELEASE_LABEL.sh" release/
          cp incoming/source/Kaigen-source-github.zip "release/Kaigen-source-$KAIGEN_RELEASE_LABEL.zip"
          sha256sum release/*
      - name: Publish seven exact Actions-produced assets without running tests
        if: inputs.existing_release_id == ''
        run: |
          set -euo pipefail
          prerelease=false
          [[ "$KAIGEN_PACKAGE_VERSION" != *-rc.* ]] || prerelease=true
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$current_main" == "$EXPECTED_SHA" ]] || { echo 'main moved before publication' >&2; exit 1; }
          if git rev-parse --verify "refs/tags/$KAIGEN_RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(git rev-parse "$KAIGEN_RELEASE_TAG^{commit}")" == "$EXPECTED_SHA" ]] || { echo 'existing tag belongs to another commit' >&2; exit 1; }
          fi
          if gh release view "$KAIGEN_RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            gh release view "$KAIGEN_RELEASE_TAG" --json isDraft,assets > existing-draft.json
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const draft = JSON.parse(fs.readFileSync('existing-draft.json', 'utf8'));
          assert.equal(draft.isDraft, true, 'existing published release is preserved');
          const expected = new Set(fs.readdirSync('release'));
          assert.equal(expected.size, 7, 'seven producer assets required');
          assert.ok(draft.assets.every(asset => expected.has(asset.name)), 'existing draft contains unrelated assets; preserve it without uploading');
          JS
          else
            printf 'Kaigen %s. Desktop Windows, Debian, macOS and Web packages produced by GitHub Actions.\n\nmacOS: ad-hoc signed, not notarized.\n' "$KAIGEN_RELEASE_LABEL" > release-notes.txt
            printf 'macOS requires version 12 or later. Tor 0.4.9.14 and Lyrebird 0.9.0 are included on all platforms.\n' >> release-notes.txt
            gh release create "$KAIGEN_RELEASE_TAG" --target "$EXPECTED_SHA" --title "Kaigen $KAIGEN_RELEASE_LABEL" --notes-file release-notes.txt --draft --prerelease="$prerelease"
          fi
          gh release upload "$KAIGEN_RELEASE_TAG" release/* --clobber
          gh release view "$KAIGEN_RELEASE_TAG" --json assets > uploaded-assets.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const expected = fs.readdirSync('release').sort();
          const uploaded = JSON.parse(fs.readFileSync('uploaded-assets.json', 'utf8')).assets.map(asset => asset.name).sort();
          assert.deepEqual(uploaded, expected, 'asset set changed; preserve draft without publishing');
          JS
          gh release edit "$KAIGEN_RELEASE_TAG" --draft=false --prerelease="$prerelease"
      - name: Refresh the seven assets on the existing release and preserve its tag
        if: inputs.existing_release_id != ''
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {
            EXISTING_RELEASE_ID: releaseId, EXISTING_TAG_SHA: originalSha,
            EXPECTED_SHA: hotfixSha, GITHUB_REPOSITORY: repo, KAIGEN_RELEASE_TAG: tag,
            KAIGEN_RELEASE_LABEL: label, KAIGEN_PACKAGE_VERSION: packageVersion,
            GITHUB_RUN_ID: runId, GITHUB_RUN_ATTEMPT: attempt
          } = process.env;
          const releaseRoute = 'releases/' + releaseId;
          const prefix = 'kaigen-refresh-' + runId + '-' + attempt + '-';
          const names = fs.readdirSync('release').sort();
          assert.equal(names.length, 7);
          const assetRoute = id => 'releases/assets/' + id;
          const metadata = release => Object.fromEntries(
            ['id', 'tag_name', 'target_commitish', 'name', 'draft', 'prerelease', 'published_at', 'immutable']
              .map(key => [key, release[key]])
          );
          const assetIdentity = asset => ({
            id: asset.id, name: asset.name, label: asset.label, size: asset.size, digest: asset.digest, state: asset.state
          });
          const orderedAssets = assets => assets.map(assetIdentity).sort((a, b) => a.id - b.id);
          function api(route, method = 'GET', body) {
            // Use a fresh API connection after long artifact uploads.
            const response = execFileSync('gh', [
              'api', '--method', method, '-H', 'Accept: application/vnd.github+json',
              '-H', 'Content-Type: application/json',
              '-H', 'X-GitHub-Api-Version: 2022-11-28', 'repos/' + repo + '/' + route,
              ...(body === undefined ? [] : ['--input', '-'])
            ], {
              encoding: 'utf8',
              input: body === undefined ? undefined : JSON.stringify(body)
            });
            return response.trim() ? JSON.parse(response) : undefined;
          }
          async function verifyTag() {
            const tagRef = await api('git/ref/tags/' + encodeURIComponent(tag));
            assert.equal(tagRef.object.type, 'commit', 'expected a lightweight release tag');
            assert.equal(tagRef.object.sha, originalSha, 'original tag changed');
          }
          async function verifyMain() {
            assert.equal((await api('branches/main')).commit.sha, hotfixSha, 'main moved before refresh');
          }
          function rename(asset, name) {
            return api(assetRoute(asset.id), 'PATCH', { name });
          }
          const originalPackage = JSON.parse(execFileSync('git', ['show', originalSha + ':package.json'], { encoding: 'utf8' }));
          assert.equal(originalPackage.version, packageVersion, 'refresh must preserve the package version');
          await verifyTag();
          await verifyMain();
          const original = await api('releases/tags/' + encodeURIComponent(tag));
          assert.equal(original.id, Number(releaseId), 'unexpected published release ID');
          assert.equal(original.tag_name, tag);
          assert.equal(original.target_commitish, originalSha, 'unexpected published release target');
          assert.equal(original.draft, false);
          assert.equal(original.immutable, false);
          const originalAssets = orderedAssets(original.assets);
          const originals = originalAssets.filter(asset => names.includes(asset.name));
          const siteName = 'Kaigen-Site-' + label + '.tar.gz';
          const preserved = originalAssets.filter(asset => !names.includes(asset.name));
          assert.deepEqual(originals.map(asset => asset.name).sort(), names, 'unexpected original product assets');
          assert.ok(preserved.length === 0 || (preserved.length === 1 && preserved[0].name === siteName), 'unexpected original additional assets');
          const siteAssets = release => orderedAssets(release.assets.filter(asset => asset.name === siteName));
          for (const asset of originalAssets) {
            assert.equal(asset.state, 'uploaded');
            assert.match(asset.digest, /^sha256:[a-f0-9]{64}$/);
          }
          const sourceZip = 'Kaigen-source-' + label + '.zip';
          const begin = '<!-- kaigen-actions-hotfix-source -->';
          const end = '<!-- /kaigen-actions-hotfix-source -->';
          const originalBody = original.body ?? '';
          const startIndex = originalBody.indexOf(begin);
          const endIndex = originalBody.indexOf(end);
          assert.equal(startIndex >= 0, endIndex >= 0, 'invalid hotfix source note');
          assert.ok(endIndex === -1 || endIndex > startIndex, 'invalid hotfix source note order');
          const note = [
            begin,
            'The release assets were rebuilt by GitHub Actions from commit `' + hotfixSha + '`.',
            'Download the [Kaigen source ZIP](https://github.com/' + repo + '/releases/download/' + tag + '/' + sourceZip + ') for the source used to build these packages.',
            'GitHub’s automatic “Source code” archives still refer to the original release tag at `' + originalSha + '`.',
            end
          ].join('\n');
          const body = startIndex === -1
            ? originalBody + '\n\n' + note
            : originalBody.slice(0, startIndex) + note + originalBody.slice(endIndex + end.length);
          const candidates = names.map(name => {
            const size = fs.statSync('release/' + name).size;
            assert.ok(size > 0);
            const hash = execFileSync('sha256sum', ['release/' + name], { encoding: 'utf8' }).split(' ')[0];
            assert.match(hash, /^[a-f0-9]{64}$/);
            const stagedName = prefix + 'new-' + name;
            fs.linkSync('release/' + name, 'release/' + stagedName);
            return { name, stagedName, size, digest: 'sha256:' + hash };
          });
          const backups = originals.map(asset => ({ ...asset, name: prefix + 'old-' + asset.name }));
          console.log('Original asset IDs and digests:', JSON.stringify(originals));
          let startingPromotion = false;
          try {
            execFileSync('gh', ['release', 'upload', tag, ...candidates.map(asset => 'release/' + asset.stagedName)],
              { stdio: 'inherit' });
            const staged = await api(releaseRoute);
            assert.deepEqual(metadata(staged), metadata(original));
            assert.equal(staged.body, original.body);
            assert.equal(staged.assets.length, originalAssets.length + candidates.length);
            assert.deepEqual(siteAssets(staged), preserved);
            assert.deepEqual(orderedAssets(staged.assets.filter(asset => names.includes(asset.name))), originals);
            for (const candidate of candidates) {
              const uploaded = staged.assets.find(asset => asset.name === candidate.stagedName);
              assert.ok(uploaded, 'candidate missing: ' + candidate.name);
              assert.equal(uploaded.state, 'uploaded');
              assert.equal(uploaded.size, candidate.size);
              assert.equal(uploaded.digest, candidate.digest);
              candidate.id = uploaded.id;
              candidate.label = uploaded.label;
            }
            await verifyTag();
            await verifyMain();
            startingPromotion = true;
            for (const backup of backups) await rename(backup, backup.name);
            for (const candidate of candidates) await rename(candidate, candidate.name);
            await api(releaseRoute, 'PATCH', { body });

            const promoted = await api(releaseRoute);
            assert.deepEqual(metadata(promoted), metadata(original));
            assert.equal(promoted.body, body);
            assert.equal(promoted.assets.length, originalAssets.length + candidates.length);
            assert.deepEqual(siteAssets(promoted), preserved);
            assert.deepEqual(orderedAssets(promoted.assets.filter(asset => backups.some(backup => backup.id === asset.id))), backups);
            const expected = candidates.map(asset => ({ ...asset, state: 'uploaded' }));
            assert.deepEqual(orderedAssets(promoted.assets.filter(asset => names.includes(asset.name))), orderedAssets(expected));
            await verifyTag();
            await verifyMain();
          } catch (error) {
            try {
              const current = await api(releaseRoute);
              assert.deepEqual(metadata(current), metadata(original));
              const stagedNames = new Set(candidates.map(asset => asset.stagedName));
              for (const asset of current.assets) {
                if (stagedNames.has(asset.name) || candidates.some(candidate => candidate.id === asset.id)) {
                  await api(assetRoute(asset.id), 'DELETE');
                }
              }
              if (startingPromotion) {
                for (const asset of originals) await rename(asset, asset.name);
                if (current.body !== original.body) await api(releaseRoute, 'PATCH', { body: originalBody });
              }
              const restored = await api(releaseRoute);
              assert.deepEqual(metadata(restored), metadata(original));
              assert.deepEqual(orderedAssets(restored.assets), originalAssets);
              assert.equal(restored.body ?? '', originalBody);
            } catch (rollbackError) {
              console.error('Release rollback requires recovery. Original assets were not deleted.', rollbackError);
            }
            throw error;
          }
          for (const asset of originals) await api(assetRoute(asset.id), 'DELETE');
          const published = await api(releaseRoute);
          assert.deepEqual(metadata(published), metadata(original));
          assert.equal(published.body, body);
          const replacements = candidates.map(asset => ({ ...asset, state: 'uploaded' }));
          assert.deepEqual(orderedAssets(published.assets), orderedAssets([...replacements, ...preserved]));
          await verifyTag();
          console.log('Published release asset IDs and digests:', JSON.stringify(orderedAssets(published.assets)));
          JS
