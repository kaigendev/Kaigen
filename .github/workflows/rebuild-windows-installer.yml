name: rebuild-kaigen-windows-installer

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact public commit containing the restored installer and this workflow
        required: true
        type: string
      release_tag:
        description: Existing release whose MSI alone will be replaced
        required: true
        default: v0.3RC1
        type: string
      expected_release_id:
        description: Exact existing release ID
        required: true
        default: '411668815'
        type: string
      original_windows_run_id:
        description: Successful original v0.3RC1 Windows portable producer
        required: true
        default: '38394947726'
        type: string

concurrency:
  group: kaigen-release-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  rebuild-and-replace-msi:
    if: github.repository == 'kaigendev/Kaigen' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
      ORIGINAL_WINDOWS_RUN_ID: ${{ inputs.original_windows_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Bind original portable producer and preserve release preimage
        id: original
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const repo = 'kaigendev/Kaigen';
          const originalSha = 'bb04c9b5cdd79ae244387305a4215258253eb1e4';
          const portableDigest = 'sha256:348dc00531538f39b02b30a05b8fcf3091f7ee82bafa746796f4ff0b04b2b4a2';
          const msiDigest = 'sha256:7e6aa97b1cb07bac113f954998616fc4265a92cbb03b3dc02f0746f3dc1f8abc';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.match(process.env.EXPECTED_SHA, /^[a-f0-9]{40}$/);
          assert.equal(process.env.GITHUB_SHA, process.env.EXPECTED_SHA);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.EXPECTED_SHA);
          assert.equal(process.env.RELEASE_TAG, 'v0.3RC1');
          assert.equal(process.env.EXPECTED_RELEASE_ID, '411668815');
          assert.equal(process.env.ORIGINAL_WINDOWS_RUN_ID, '38394947726');
          async function api(route, accept = 'application/vnd.github+json') {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + route, {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: accept, 'X-GitHub-Api-Version': '2022-11-28' }
            });
            assert.equal(response.status, 200, 'Unavailable original producer/release: ' + route);
            return response;
          }
          const json = async route => (await api(route)).json();
          assert.equal((await json('branches/main')).commit.sha, process.env.EXPECTED_SHA, 'main moved before dispatch');
          assert.equal((await json('git/ref/tags/v0.3RC1')).object.sha, originalSha);
          const run = await json('actions/runs/38394947726');
          assert.equal(run.repository.full_name, repo);
          assert.equal(run.head_repository.full_name, repo);
          assert.equal(run.path, '.github/workflows/build-windows.yml');
          assert.equal(run.head_sha, originalSha);
          assert.equal(run.head_branch, 'main');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(run.run_attempt, 1);
          const artifact = await json('actions/artifacts/11812607308');
          assert.equal(artifact.id, 11812607308);
          assert.equal(artifact.name, 'Kaigen-portable-windows-x64');
          assert.equal(artifact.expired, false);
          assert.equal(artifact.workflow_run.id, run.id);
          assert.equal(artifact.workflow_run.head_sha, originalSha);
          assert.equal(artifact.digest, 'sha256:8f0261548d5be74cc6bc6213642790420899e75c6040109e4891d54f7b97669e');
          const release = await json('releases/411668815');
          assert.equal(release.id, 411668815);
          assert.equal(release.tag_name, 'v0.3RC1');
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, true);
          assert.notEqual(release.immutable, true, 'Immutable release cannot replace its MSI');
          const select = name => {
            const matches = release.assets.filter(asset => asset.name === name);
            assert.equal(matches.length, 1, 'One exact release asset required: ' + name);
            return matches[0];
          };
          const portable = select('Kaigen-portable-windows-x64.zip');
          assert.equal(portable.id, 637019990);
          assert.equal(portable.digest, portableDigest);
          const msi = select('Kaigen-installer-windows-x64.msi');
          assert.equal(msi.id, 637019955);
          assert.equal(msi.digest, msiDigest);
          const oldBytes = Buffer.from(await (await api('releases/assets/637019955', 'application/octet-stream')).arrayBuffer());
          assert.equal(oldBytes.length, msi.size);
          assert.equal('sha256:' + createHash('sha256').update(oldBytes).digest('hex'), msiDigest);
          fs.mkdirSync('preimage', { recursive: true });
          fs.writeFileSync('preimage/Kaigen-installer-windows-x64.msi', oldBytes);
          fs.writeFileSync('preimage/release.json', JSON.stringify(release, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'portable-artifact-id=' + artifact.id + '\n');
          JS
      - name: Preserve original release MSI and metadata before replacement
        id: preimage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-original-MSI-v0.3RC1-${{ github.run_id }}-${{ github.run_attempt }}
          path: preimage/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Download exact original Actions portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.original.outputs.portable-artifact-id }}
          run-id: ${{ inputs.original_windows_run_id }}
          github-token: ${{ github.token }}
          path: incoming
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and expand original portable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = 'incoming/Kaigen-portable-windows-x64.zip'
          if ((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant() -cne '348dc00531538f39b02b30a05b8fcf3091f7ee82bafa746796f4ff0b04b2b4a2') {
            throw 'Portable archive differs from the original published Actions payload.'
          }
          Expand-Archive -LiteralPath $portable -DestinationPath artifacts
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned PowerShell 7.6.5
        shell: cmd
        run: |
          dotnet tool install --tool-path "${{ runner.temp }}\kaigen-pwsh" PowerShell --version 7.6.5
          echo ${{ runner.temp }}\kaigen-pwsh>>"%GITHUB_PATH%"
      - name: Prepare pinned WiX 3.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.ToString() -cne '7.6.5') { throw 'WiX preparation requires PowerShell 7.6.5 exactly.' }
          $wixArchive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $wixArchive
          if ((Get-FileHash -LiteralPath $wixArchive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') {
            throw 'WiX 3.14.1 archive differs from the pinned SHA-256.'
          }
          $wixRoot = Join-Path $env:RUNNER_TEMP 'kaigen-wix-3.14.1'
          Expand-Archive -LiteralPath $wixArchive -DestinationPath $wixRoot
          foreach ($name in @('candle.exe', 'light.exe', 'WixUIExtension.dll', 'WixUtilExtension.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $wixRoot $name) -PathType Leaf)) { throw "Pinned WiX tool is missing: $name" }
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $wixRoot -Encoding utf8
      - name: Rebuild MSI only without installer tests
        shell: cmd
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe"
          -NoLogo -NoProfile -NonInteractive
          -File scripts\build-windows-msi.ps1
          -PortableRoot artifacts\Kaigen-portable
          -ReleaseLabel 0.3RC1
          -ArtifactsDir artifacts
      - name: Preserve newly produced MSI
        id: produced
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-rebuilt-MSI-v0.3RC1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/Kaigen-installer-windows-x64.msi
            artifacts/Kaigen-installer-windows-x64.manifest.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Replace only original MSI and verify preserved release
        shell: bash
        env:
          PREIMAGE_ARTIFACT_ID: ${{ steps.preimage.outputs.artifact-id }}
          PRODUCED_ARTIFACT_ID: ${{ steps.produced.outputs.artifact-id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          assert.match(process.env.PREIMAGE_ARTIFACT_ID, /^[1-9][0-9]*$/);
          assert.match(process.env.PRODUCED_ARTIFACT_ID, /^[1-9][0-9]*$/);
          const repo = 'kaigendev/Kaigen';
          const baseline = JSON.parse(fs.readFileSync('preimage/release.json', 'utf8'));
          const msiName = 'Kaigen-installer-windows-x64.msi';
          const bytes = fs.readFileSync('artifacts/' + msiName);
          const digest = 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          assert.ok(bytes.length > 0);
          async function api(route) {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + route, {
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
            });
            assert.equal(response.status, 200, 'Release readback failed: ' + route);
            return response.json();
          }
          const metadata = release => Object.fromEntries(['id', 'tag_name', 'target_commitish', 'name', 'body', 'draft', 'prerelease', 'published_at', 'immutable'].map(key => [key, release[key]]));
          const assets = release => release.assets.map(asset => Object.fromEntries(['id', 'name', 'size', 'digest', 'content_type', 'label', 'state', 'created_at', 'updated_at', 'url', 'browser_download_url'].map(key => [key, asset[key]]))).sort((a, b) => a.name.localeCompare(b.name));
          const originalSha = 'bb04c9b5cdd79ae244387305a4215258253eb1e4';
          assert.equal((await api('branches/main')).commit.sha, process.env.EXPECTED_SHA, 'main moved before MSI replacement');
          assert.equal((await api('git/ref/tags/v0.3RC1')).object.sha, originalSha);
          const before = await api('releases/411668815');
          assert.deepEqual(metadata(before), metadata(baseline), 'Release metadata changed before replacement');
          assert.deepEqual(assets(before), assets(baseline), 'Release assets changed before replacement');
          execFileSync('gh', ['release', 'upload', 'v0.3RC1', 'artifacts/' + msiName, '--repo', repo, '--clobber'], { stdio: 'inherit' });
          const after = await api('releases/411668815');
          assert.deepEqual(metadata(after), metadata(baseline), 'Release metadata was changed');
          assert.deepEqual(assets(after).filter(asset => asset.name !== msiName), assets(baseline).filter(asset => asset.name !== msiName), 'An unrelated asset was changed');
          assert.equal(after.assets.length, baseline.assets.length);
          const rebuilt = after.assets.filter(asset => asset.name === msiName);
          assert.equal(rebuilt.length, 1);
          assert.equal(rebuilt[0].size, bytes.length);
          assert.equal(rebuilt[0].digest, digest);
          assert.equal(rebuilt[0].state, 'uploaded');
          assert.equal((await api('git/ref/tags/v0.3RC1')).object.sha, originalSha, 'Release tag changed');
          fs.writeFileSync('artifacts/replacement-receipt.json', JSON.stringify({ repository: repo, sourceSha: process.env.EXPECTED_SHA, originalPayloadSha: originalSha, originalWindowsRunId: 38394947726, portableArtifactId: 11812607308, releaseId: after.id, releaseTag: after.tag_name, replacementRunId: process.env.GITHUB_RUN_ID, replacementRunAttempt: process.env.GITHUB_RUN_ATTEMPT, preimageArtifactId: process.env.PREIMAGE_ARTIFACT_ID, producedArtifactId: process.env.PRODUCED_ARTIFACT_ID, oldMsi: baseline.assets.find(asset => asset.name === msiName), newMsi: rebuilt[0], otherAssetsPreserved: true, releaseMetadataPreserved: true, tagPreserved: true, productTestsRun: false }, null, 2) + '\n');
          console.log('Replaced only ' + msiName + ': ' + digest);
          JS
      - name: Preserve replacement receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-MSI-replacement-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/replacement-receipt.json
          retention-days: 30
          if-no-files-found: error
