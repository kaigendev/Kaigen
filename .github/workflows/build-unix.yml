name: build-kaigen-linux-macos-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  debian-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file pkg-config unzip zip cmake ninja-build libfuse2 \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify Debian portable AppImage
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kaigen-portable-debian-x64
          path: artifacts/Kaigen-portable-debian-x64.zip
          if-no-files-found: error

  macos-universal:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: brew install cmake ninja pkg-config autoconf automake libtool
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build and verify universal macOS app and DMG
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Kaigen-portable-macos-universal
          path: artifacts/Kaigen-portable-macos-universal.zip
          if-no-files-found: error
