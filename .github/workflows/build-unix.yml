name: build-kaigen-linux-macos-portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  debian-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file pkg-config unzip zip cmake ninja-build libfuse2 \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify public incremental baseline and prepare exact selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-incremental-verification.mjs prepare --platform debian --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
      - name: Prime GitHub runner package caches
        run: |
          npm ci
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Restore the pinned AppImage plugin from its official upstream Actions artifact
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}/kaigen-component-cache
        run: |
          python3 -I - <<'PY'
          import hashlib, io, json, os, pathlib, stat, urllib.error, urllib.parse, urllib.request, zipfile
          assert os.environ.get('GITHUB_ACTIONS') == 'true', 'Pinned plugin bootstrap is restricted to GitHub Actions'
          repository = 'linuxdeploy/linuxdeploy-plugin-appimage'
          repository_id, run_id, artifact_id = 137514062, 33467741325, 9785454068
          source = '536b068787179ea901964bd7dabc7bf61e4941c3'
          zip_sha = 'c51e47d9fd33be78c30bb2994e990ac46f0577d32898b13de0db18a6c051d159'
          plugin_sha = '0441769ab38009504d2678c38cd7e526955388dd30a215b4a20afaa5471652f2'
          plugin_name = 'linuxdeploy-plugin-appimage-x86_64.AppImage'
          api_root = 'https://api.github.com/repos/' + repository
          headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Kaigen-pinned-component-bootstrap'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, response_headers, url):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def metadata(suffix):
              with opener.open(urllib.request.Request(api_root + suffix, headers=headers), timeout=60) as response:
                  assert response.status == 200, 'Official upstream metadata is unavailable'
                  return json.load(response)
          repo = metadata('')
          assert repo['id'] == repository_id and repo['full_name'] == repository and repo['private'] is False, 'Unexpected official upstream repository'
          run = metadata('/actions/runs/' + str(run_id))
          assert run['id'] == run_id and run['repository']['id'] == repository_id and run['head_repository']['id'] == repository_id, 'Unexpected upstream run repository'
          assert run['repository']['full_name'] == repository and run['head_repository']['full_name'] == repository, 'Unexpected upstream run owner'
          assert run['head_sha'] == source and run['head_branch'] == 'master' and run['event'] == 'schedule' and run['run_attempt'] == 1, 'Unexpected upstream run source'
          assert run['path'] == '.github/workflows/main.yml' and run['status'] == 'completed' and run['conclusion'] == 'success', 'Upstream producer did not pass'
          artifact = metadata('/actions/artifacts/' + str(artifact_id))
          assert artifact['id'] == artifact_id and artifact['name'] == 'AppImage x86_64' and artifact['expired'] is False, 'Unexpected or expired upstream artifact'
          assert artifact['digest'] == 'sha256:' + zip_sha and artifact['size_in_bytes'] == 16074040, 'Upstream artifact ZIP identity changed'
          producer = artifact['workflow_run']
          assert producer['id'] == run_id and producer['repository_id'] == repository_id and producer['head_repository_id'] == repository_id, 'Artifact belongs to another upstream run'
          assert producer['head_sha'] == source and producer['head_branch'] == 'master', 'Artifact producer source changed'
          archive_url = api_root + '/actions/artifacts/' + str(artifact_id) + '/zip'
          assert artifact['archive_download_url'] == archive_url, 'Unexpected upstream artifact download endpoint'
          relay_url = 'https://nightly.link/linuxdeploy/linuxdeploy-plugin-appimage/actions/artifacts/9785454068.zip'
          try:
              with opener.open(urllib.request.Request(relay_url), timeout=60):
                  raise AssertionError('Pinned artifact relay must return exactly HTTP 302; proxy bytes are forbidden')
          except urllib.error.HTTPError as response:
              assert response.code == 302, 'Pinned artifact redirect is unavailable; no fallback is allowed'
              location = response.headers['Location']
          target_url = urllib.parse.urlparse(location)
          assert target_url.scheme == 'https' and not target_url.username and not target_url.password and target_url.port in (None, 443), 'Unsafe artifact redirect'
          assert target_url.hostname == 'productionresultssa13.blob.core.windows.net', 'Unexpected GitHub artifact storage host'
          # The fixed relay supplies only the address; verified bytes come from GitHub storage without credentials.
          with opener.open(urllib.request.Request(location), timeout=90) as response:
              assert response.status == 200, 'Official upstream artifact storage is unavailable'
              payload = response.read(16074041)
          assert len(payload) == 16074040 and hashlib.sha256(payload).hexdigest() == zip_sha, 'Downloaded upstream ZIP identity changed'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              entries = archive.infolist()
              assert len(entries) == 2 and {entry.filename for entry in entries} == {plugin_name, plugin_name + '.zsync'}, 'Unexpected upstream artifact entries'
              assert all(stat.S_ISREG(entry.external_attr >> 16) and not entry.is_dir() and not entry.flag_bits & 1 for entry in entries), 'Upstream artifact contains a non-regular or encrypted entry'
              entry = archive.getinfo(plugin_name)
              assert entry.file_size == 16484856, 'Pinned AppImage plugin size changed'
              with archive.open(entry) as stream:
                  plugin = stream.read(16484857)
          assert len(plugin) == 16484856 and hashlib.sha256(plugin).hexdigest() == plugin_sha, 'Pinned AppImage plugin SHA-256 changed'
          cache = pathlib.Path(os.environ['KAIGEN_COMPONENT_CACHE_ROOT'])
          assert cache == pathlib.Path(os.environ['RUNNER_TEMP']) / 'kaigen-component-cache', 'Unexpected runner component cache root'
          destination = cache / plugin_sha.upper() / 'linuxdeploy-plugin-appimage.AppImage'
          for ancestor in destination.parents:
              if ancestor.exists() or ancestor.is_symlink():
                  assert stat.S_ISDIR(ancestor.lstat().st_mode) and not ancestor.is_symlink(), 'Unsafe component cache ancestry'
          destination.parent.mkdir(parents=True, exist_ok=True)
          if destination.exists() or destination.is_symlink():
              assert stat.S_ISREG(destination.lstat().st_mode) and not destination.is_symlink(), 'Unsafe existing pinned plugin'
              assert destination.read_bytes() == plugin, 'Existing canonical plugin differs from the pinned bytes'
          else:
              with destination.open('xb') as output:
                  output.write(plugin)
          destination.chmod(0o555)
          print('Pinned AppImage plugin restored from official upstream Actions artifact 9785454068 into the canonical component cache')
          PY
      - name: Build and verify Debian portable AppImage
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}/kaigen-component-cache
          KAIGEN_ALLOW_NETWORK_COMPONENT_FETCH: "1"
          KAIGEN_COMPONENT_UPDATE_SCOPE: all-managed-components
          KAIGEN_PREPARED_NATIVE_CACHE_ROOT: ${{ runner.temp }}/kaigen-prepared-native-cache
          KAIGEN_PREPARED_NATIVE_CACHE_MODE: populate
        run: |
          bash scripts/build-appimage.sh
      - name: Bind incremental verification to final artifact
        run: node scripts/ci-incremental-verification.mjs finalize --platform debian --evidence-root "${{ runner.temp }}/kaigen-ci-evidence" --archive artifacts/Kaigen-portable-debian-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-verification-debian
          path: artifacts/ci-verification-debian.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-portable-debian-x64
          path: artifacts/Kaigen-portable-debian-x64.zip
          if-no-files-found: error

  macos-universal:
    runs-on: macos-14
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: brew install cmake ninja pkg-config autoconf automake libtool
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify public incremental baseline and prepare exact selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-incremental-verification.mjs prepare --platform macos --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Prime GitHub runner package caches
        run: |
          npm ci
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure explicitly unsigned pull-request test mode
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          printf 'KAIGEN_MACOS_DISTRIBUTION_MODE=unsigned-test\n' >> "$GITHUB_ENV"
          echo "::warning::macOS PR build is ad-hoc signed and not notarized. Its name and payload are marked UNSIGNED-TEST; it is not release-ready."
      - name: Configure macOS release signing mode
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          KAIGEN_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.KAIGEN_MACOS_CERTIFICATE_P12_BASE64 }}
          KAIGEN_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.KAIGEN_MACOS_CERTIFICATE_PASSWORD }}
          KAIGEN_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.KAIGEN_MACOS_KEYCHAIN_PASSWORD }}
          KAIGEN_MACOS_CODESIGN_IDENTITY: ${{ secrets.KAIGEN_MACOS_CODESIGN_IDENTITY }}
          KAIGEN_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.KAIGEN_MACOS_NOTARY_KEY_P8_BASE64 }}
          KAIGEN_MACOS_NOTARY_KEY_ID: ${{ secrets.KAIGEN_MACOS_NOTARY_KEY_ID }}
          KAIGEN_MACOS_NOTARY_ISSUER_ID: ${{ secrets.KAIGEN_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            KAIGEN_MACOS_CERTIFICATE_P12_BASE64 \
            KAIGEN_MACOS_CERTIFICATE_PASSWORD \
            KAIGEN_MACOS_KEYCHAIN_PASSWORD \
            KAIGEN_MACOS_CODESIGN_IDENTITY \
            KAIGEN_MACOS_NOTARY_KEY_P8_BASE64 \
            KAIGEN_MACOS_NOTARY_KEY_ID \
            KAIGEN_MACOS_NOTARY_ISSUER_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 7 )); then
            echo "::warning::Apple signing secrets are not configured; building the same ad-hoc signed, non-notarized macOS release class used for Kaigen v0.2.0."
            printf 'KAIGEN_MACOS_DISTRIBUTION_MODE=adhoc-release\n' >> "$GITHUB_ENV"
            exit 0
          fi
          if (( ${#missing[@]} )); then
            printf '::error::macOS release signing configuration is partial; missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/kaigen-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/kaigen-notary-key.p8"
          keychain_path="$RUNNER_TEMP/kaigen-signing.keychain-db"
          printf '%s' "$KAIGEN_MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$KAIGEN_MACOS_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$notary_key_path"
          security create-keychain -p "$KAIGEN_MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KAIGEN_MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$KAIGEN_MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KAIGEN_MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F "$KAIGEN_MACOS_CODESIGN_IDENTITY"

          notary_profile='kaigen-ci-notary'
          xcrun notarytool store-credentials "$notary_profile" \
            --key "$notary_key_path" \
            --key-id "$KAIGEN_MACOS_NOTARY_KEY_ID" \
            --issuer "$KAIGEN_MACOS_NOTARY_ISSUER_ID"
          printf 'KAIGEN_CODESIGN_IDENTITY=%s\n' "$KAIGEN_MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          printf 'KAIGEN_NOTARYTOOL_PROFILE=%s\n' "$notary_profile" >> "$GITHUB_ENV"
          printf 'KAIGEN_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          printf 'KAIGEN_MACOS_DISTRIBUTION_MODE=distribution\n' >> "$GITHUB_ENV"
      - name: Build and verify universal macOS app and DMG
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}/kaigen-component-cache
          KAIGEN_ALLOW_NETWORK_COMPONENT_FETCH: "1"
          KAIGEN_COMPONENT_UPDATE_SCOPE: all-managed-components
          KAIGEN_PREPARED_NATIVE_CACHE_ROOT: ${{ runner.temp }}/kaigen-prepared-native-cache
          KAIGEN_PREPARED_NATIVE_CACHE_MODE: populate
        run: |
          bash scripts/build-macos.sh
      - name: Bind incremental verification to final artifact
        shell: bash
        run: |
          archive=artifacts/Kaigen-portable-macos-universal.zip
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then archive=artifacts/Kaigen-portable-macos-universal-UNSIGNED-TEST.zip; fi
          node scripts/ci-incremental-verification.mjs finalize --platform macos --evidence-root "$RUNNER_TEMP/kaigen-ci-evidence" --archive "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-verification-macos
          path: artifacts/ci-verification-macos.json
          if-no-files-found: error
      - name: Upload explicitly unsigned pull-request test artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-portable-macos-universal-UNSIGNED-TEST
          path: artifacts/Kaigen-portable-macos-universal-UNSIGNED-TEST.zip
          if-no-files-found: error
      - name: Upload macOS release artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-portable-macos-universal
          path: artifacts/Kaigen-portable-macos-universal.zip
          if-no-files-found: error
      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${KAIGEN_SIGNING_KEYCHAIN:-}" && -f "$KAIGEN_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$KAIGEN_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/kaigen-developer-id.p12" "$RUNNER_TEMP/kaigen-notary-key.p8"

  web-debian13-nginx:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      KAIGEN_RELEASE_LABEL: 0.2.9.8
      KAIGEN_WEB_BUILD_ID: kaigen-0.2.9.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl pkg-config unzip cmake ninja-build \
            autoconf automake libtool
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Verify public incremental baseline and prepare exact selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-incremental-verification.mjs prepare --platform web --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
      - name: Install pinned PowerShell 7.6.5
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/kaigen-pwsh" PowerShell --version 7.6.5
          echo "$RUNNER_TEMP/kaigen-pwsh" >> "$GITHUB_PATH"
      - name: Prime GitHub runner package caches
        run: |
          npm ci
          cargo fetch --locked --manifest-path web/kaigen-webd/Cargo.toml
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare pinned Web native runtime
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}/kaigen-component-cache
          KAIGEN_ALLOW_NETWORK_COMPONENT_FETCH: "1"
          KAIGEN_COMPONENT_UPDATE_SCOPE: all-managed-components
          KAIGEN_PREPARED_NATIVE_CACHE_ROOT: ${{ runner.temp }}/kaigen-prepared-native-cache
          KAIGEN_PREPARED_NATIVE_CACHE_MODE: populate
        run: |
          bash scripts/prepare-unix-dependencies.sh linux
      - name: Build and verify Web release bundle
        env:
          KAIGEN_TOXCORE_LIB_DIR: ${{ github.workspace }}/work/platform/linux/toxcore/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/work/platform/linux/toxcore/lib
          KAIGEN_PREPARED_NATIVE_CACHE_ROOT: ${{ runner.temp }}/kaigen-prepared-native-cache
          KAIGEN_PREPARED_NATIVE_CACHE_MODE: populate
        run: |
          node scripts/ci-incremental-verification.mjs run-tests --platform web --evidence-root "$RUNNER_TEMP/kaigen-ci-evidence"
          "$RUNNER_TEMP/kaigen-pwsh/pwsh" -NoLogo -NoProfile -NonInteractive \
            -File scripts/Invoke-KaigenAutomation.ps1 \
            -Task web-installer-bundle \
            -ReleaseLabel "$KAIGEN_RELEASE_LABEL" \
            -ArtifactsDir artifacts
      - name: Verify Web release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="artifacts/Kaigen-Web-Debian13-Nginx-$KAIGEN_RELEASE_LABEL.tar.gz"
          staging="$RUNNER_TEMP/kaigen-web-bundle-check"
          mkdir -p "$staging"
          tar -xzf "$archive" -C "$staging"
          (cd "$staging" && sha256sum -c manifest.sha256)
          test -x "$staging/payload/bin/kaigen-webd"
          test -f "$staging/payload/lib/Kaigen/libtoxcore.so.2.23.0"
          test -x "$staging/payload/TorExpertBundle/tor/tor"
          test -x "$staging/payload/TorExpertBundle/tor/pluggable_transports/lyrebird"
          test -x "$staging/payload/TorExpertBundle/tor/pluggable_transports/conjure-client"
          test -f "$staging/payload/TorExpertBundle/tor/pluggable_transports/pt_config.json"
          test -f "$staging/payload/TorExpertBundle/data/geoip"
          test -f "$staging/payload/TorExpertBundle/data/geoip6"
          test -f "$staging/payload/ui/index.html"
          test "$(tr -d '\r\n' < "$staging/release-id")" = "$KAIGEN_WEB_BUILD_ID"
          bootstrap="artifacts/Kaigen-Web-Installer-$KAIGEN_RELEASE_LABEL.sh"
          test -x "$bootstrap"
          bash -n "$bootstrap"
          bundle_sha="$(sha256sum "$archive" | awk '{print $1}')"
          grep -Fqx "BUNDLE_SHA256='$bundle_sha'" "$bootstrap"
          grep -Fqx "RELEASE_LABEL='$KAIGEN_RELEASE_LABEL'" "$bootstrap"
          grep -Fqx "BUILD_ID='$KAIGEN_WEB_BUILD_ID'" "$bootstrap"
      - name: Bind incremental verification to final artifacts
        run: >-
          node scripts/ci-incremental-verification.mjs finalize
          --platform web --evidence-root "${{ runner.temp }}/kaigen-ci-evidence"
          --archive "artifacts/Kaigen-Web-Debian13-Nginx-$KAIGEN_RELEASE_LABEL.tar.gz"
          --archive "artifacts/Kaigen-Web-Installer-$KAIGEN_RELEASE_LABEL.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-verification-web
          path: artifacts/ci-verification-web.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaigen-Web-Debian13-Nginx-0.2.9.8
          path: |
            artifacts/Kaigen-Web-Debian13-Nginx-0.2.9.8.tar.gz
            artifacts/Kaigen-Web-Installer-0.2.9.8.sh
          if-no-files-found: error
