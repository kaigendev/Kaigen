name: extended-native-regressions

on:
  workflow_dispatch:
    inputs:
      run_scale:
        description: Run the three large ignored tests with explicit resource budgets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pq-and-optional-scale:
    name: ${{ matrix.job }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.run_scale && '["pq-fault-desktop","pq-fault-web-core","managed-history-100k","qtox-import-million","web-outer-checkpoint"]' || '["pq-fault-desktop","pq-fault-web-core"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-18
        with:
          toolchain: 1.99.0
          components: rust-src
          targets: x86_64-pc-windows-msvc
      - name: Install the required PowerShell 7.6.5
        shell: cmd
        run: |
          dotnet tool install --tool-path "${{ runner.temp }}\kaigen-pwsh" PowerShell --version 7.6.5
          echo ${{ runner.temp }}\kaigen-pwsh>>"%GITHUB_PATH%"
      - name: Prepare pinned native inputs through the component workflow
        shell: cmd
        env:
          KAIGEN_COMPONENT_CACHE_ROOT: ${{ runner.temp }}\kaigen-component-cache
          KAIGEN_COMPONENT_UPDATE_SCOPE: all-managed-components
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe" -NoLogo -NoProfile -NonInteractive
          -File scripts/Invoke-KaigenAutomation.ps1
          -Task ci-windows-prime
          -ComponentCacheRoot "${{ runner.temp }}\kaigen-component-cache"
      - name: Compile and verify native inputs before binding test source identity
        shell: cmd
        run: >-
          "${{ runner.temp }}\kaigen-pwsh\pwsh.exe" -NoLogo -NoProfile -NonInteractive
          -File scripts/build-portable.ps1
          -ComponentCacheRoot "${{ runner.temp }}\kaigen-component-cache"
          -PreparedNativeCacheRoot "${{ runner.temp }}\kaigen-prepared-native-cache"
          -PreparedNativeCacheMode build-on-miss
          -PopulatePreparedNativeCacheOnly
          -ArtifactsDir "${{ runner.temp }}\kaigen-native-preparation"
      - name: Run exact discovered tests and resource gates
        env:
          RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-msvc
          RUSTUP_AUTO_INSTALL: '0'
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          node scripts/extended-native-verification.mjs --job ${{ matrix.job }}
          --evidence-root "${{ runner.temp }}/kaigen-extended-evidence"
      - name: Preserve test counts, process observations and raw output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-native-${{ matrix.job }}
          path: |
            ${{ runner.temp }}/kaigen-native-preparation/prepared-native-cache-windows-x64-native-only-populate.json
            ${{ runner.temp }}/kaigen-extended-evidence/**/compile/stdout.log
            ${{ runner.temp }}/kaigen-extended-evidence/**/compile/stderr.log
            ${{ runner.temp }}/kaigen-extended-evidence/**/result.json
            ${{ runner.temp }}/kaigen-extended-evidence/**/resource.json
            ${{ runner.temp }}/kaigen-extended-evidence/**/process.stdout.log
            ${{ runner.temp }}/kaigen-extended-evidence/**/process.stderr.log
          if-no-files-found: error
