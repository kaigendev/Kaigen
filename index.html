<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kaigen-icon.png" />
    <link rel="preload" as="image" href="/kaigen-icon.png" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaigen</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #050a10; }
      body { overflow: hidden; color: #f1f5f8; font-family: Inter, "Segoe UI", Arial, sans-serif; }
      #kaigen-bootstrap-splash { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 42%, #152131 0, #090f18 56%, #050a10 100%); }
      #kaigen-bootstrap-splash > div { display: grid; width: min(360px, 55vw); justify-items: center; }
      #kaigen-bootstrap-splash img { display: block; width: 150px; height: 150px; border-radius: 50%; object-fit: cover; }
      #kaigen-bootstrap-splash strong { margin-top: 12px; font-size: 34px; font-weight: 300; letter-spacing: .42em; transform: translateX(.21em); }
    </style>
  </head>

  <body>
    <div id="root"><section id="kaigen-bootstrap-splash" aria-label="Kaigen is loading"><div><img src="/kaigen-icon.png" alt="" /><strong>KAIGEN</strong></div></section></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
