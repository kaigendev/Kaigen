[package]
name = "kaigen-webd"
version = "0.2.2+2"
description = "Native Kaigen web workspace service"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[workspace]

[dependencies]
aes-gcm = "=0.11.0"
base64 = "=0.22.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.10.6"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "net", "rt-multi-thread", "time"] }
tauri-app-lib = { package = "kaigen", path = "../../src-tauri", default-features = false, features = ["web-core"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
